nine building blocks.<\/span><span class=\"lc-toggle\"><\/span><\/span><\/summary>\n      <div class=\"lc-slide\"><img src=\"media/l04-s07.svg\" alt=\"Lecture 4, slide 7\"><\/div>\n    <\/details>\n  <\/div>\n<\/div>"}, {"id": "7", "ord": 1, "kind": "Mathematics", "role": "formula", "model": "Lectern Q&A", "weight": "asked 4×, proof question", "note": "", "front": "<div class=\"lc lc-front role-formula\">\n  <div class=\"lc-tab is-asked\">asked 4×, proof question<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">03<\/span> <span class=\"lc-topic\">Inner product spaces<\/span><\/header>\n    <div class=\"lc-q\">State the Cauchy-Schwarz inequality for \\(u, v\\) in an inner product space.<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-slot\"><div class=\"lc-shape\" aria-hidden=\"true\"><span><\/span><span><\/span><\/div><\/div>\n  <\/div>\n<\/div>", "back": "<div class=\"lc lc-back role-formula\">\n  <div class=\"lc-tab is-asked\">asked 4×, proof question<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">03<\/span> <span class=\"lc-topic\">Inner product spaces<\/span><\/header>\n    <div class=\"lc-q\">State the Cauchy-Schwarz inequality for \\(u, v\\) in an inner product space.<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-a\" id=\"answer\"><div class=\"lc-body\">\\[ \\lvert \\langle u, v \\rangle \\rvert \\le \\lVert u \\rVert \\, \\lVert v \\rVert \\]Equality holds exactly when \\(u\\) and \\(v\\) are <mark>linearly dependent<\/mark>.<\/div><\/div>\n    \n    <details class=\"lc-plate\">\n      <summary><span class=\"lc-thumb\"><img src=\"media/l03-s12.svg\" alt=\"Lecture 3, slide 12\"><\/span><span class=\"lc-cite\"><span class=\"lc-src\">Lecture 3, slide 12<\/span><span class=\"lc-excerpt\">Theorem 3.4 (Cauchy-Schwarz). For all u, v in V: |⟨u, v⟩| ≤ ‖u‖ ‖v‖.<\/span><span class=\"lc-toggle\"><\/span><\/span><\/summary>\n      <div class=\"lc-slide\"><img src=\"media/l03-s12.svg\" alt=\"Lecture 3, slide 12\"><\/div>\n    <\/details>\n  <\/div>\n<\/div>"}, {"id": "8", "ord": 1, "kind": "Mathematics", "role": "why", "model": "Lectern Q&A", "weight": "core", "note": "", "front": "<div class=\"lc lc-front role-why\">\n  <div class=\"lc-tab\">core<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">01<\/span> <span class=\"lc-topic\">Sequences<\/span><\/header>\n    <div class=\"lc-q\">Why is every convergent sequence bounded?<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-slot\"><div class=\"lc-shape\" aria-hidden=\"true\"><span><\/span><span><\/span><\/div><\/div>\n  <\/div>\n<\/div>", "back": "<div class=\"lc lc-back role-why\">\n  <div class=\"lc-tab\">core<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">01<\/span> <span class=\"lc-topic\">Sequences<\/span><\/header>\n    <div class=\"lc-q\">Why is every convergent sequence bounded?<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-a\" id=\"answer\"><div class=\"lc-body\"><ul><li>Beyond some \\(N\\), all terms lie <mark>within 1 of the limit<\/mark>.<\/li><li>The finitely many earlier terms have a maximum.<\/li><\/ul><\/div><\/div>\n    <div class=\"lc-extra\">So for every \\(n\\): \\[ \\lvert a_n \\rvert \\le \\max(\\lvert a_1 \\rvert, \\dots, \\lvert a_N \\rvert, \\lvert a \\rvert + 1) \\]<\/div>\n    <details class=\"lc-plate\">\n      <summary><span class=\"lc-thumb\"><img src=\"media/l01-s18.svg\" alt=\"Lecture 1, slide 18\"><\/span><span class=\"lc-cite\"><span class=\"lc-src\">Lecture 1, slide 18<\/span><span class=\"lc-excerpt\">Lemma 1.7. Every convergent sequence is bounded. Proof: choose ε = 1.<\/span><span class=\"lc-toggle\"><\/span><\/span><\/summary>\n      <div class=\"lc-slide\"><img src=\"media/l01-s18.svg\" alt=\"Lecture 1, slide 18\"><\/div>\n    <\/details>\n  <\/div>\n<\/div>"}, {"id": "9", "ord": 1, "kind": "Computer science", "role": "code", "model": "Lectern Q&A", "weight": "asked 2×, short answer", "note": "", "front": "<div class=\"lc lc-front role-code\">\n  <div class=\"lc-tab is-asked\">asked 2×, short answer<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">05<\/span> <span class=\"lc-topic\">Searching<\/span><\/header>\n    <div class=\"lc-q\">What does this function return for a sorted array, and in what time?<\/div>\n    <pre class=\"lc-code\"><code>def find(xs, target):\n    lo, hi = 0, len(xs) - 1\n    while lo &lt;= hi:\n        mid = (lo + hi) // 2\n        if xs[mid] == target:\n            return mid\n        if xs[mid] &lt; target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1<\/code><\/pre>\n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-slot\"><div class=\"lc-shape\" aria-hidden=\"true\"><span>Returns<\/span><span>Time<\/span><\/div><\/div>\n  <\/div>\n<\/div>", "back": "<div class=\"lc lc-back role-code\">\n  <div class=\"lc-tab is-asked\">asked 2×, short answer<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">05<\/span> <span class=\"lc-topic\">Searching<\/span><\/header>\n    <div class=\"lc-q\">What does this function return for a sorted array, and in what time?<\/div>\n    <pre class=\"lc-code\"><code>def find(xs, target):\n    lo, hi = 0, len(xs) - 1\n    while lo &lt;= hi:\n        mid = (lo + hi) // 2\n        if xs[mid] == target:\n            return mid\n        if xs[mid] &lt; target:\n            lo = mid + 1\n        else:\n            hi = mid - 1\n    return -1<\/code><\/pre>\n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-a\" id=\"answer\"><div class=\"lc-labels\"><span>Returns<\/span><span>Time<\/span><\/div><div class=\"lc-body\"><ul><li>The index of <code>target<\/code>, or -1<\/li><li><mark>O(log n)<\/mark><\/li><\/ul><\/div><\/div>\n    <div class=\"lc-extra\">Each pass halves the range from lo to hi.<\/div>\n    <details class=\"lc-plate\">\n      <summary><span class=\"lc-thumb\"><img src=\"media/l05-s06.svg\" alt=\"Lecture 5, slide 6\"><\/span><span class=\"lc-cite\"><span class=\"lc-src\">Lecture 5, slide 6<\/span><span class=\"lc-excerpt\">Binary search: compare with the middle element, discard half of the range.<\/span><span class=\"lc-toggle\"><\/span><\/span><\/summary>\n      <div class=\"lc-slide\"><img src=\"media/l05-s06.svg\" alt=\"Lecture 5, slide 6\"><\/div>\n    <\/details>\n  <\/div>\n<\/div>"}, {"id": "10", "ord": 1, "kind": "Computer science", "role": "cloze", "model": "Lectern Cloze", "weight": "asked 3×, multiple choice", "note": "Cloze note, card 1 of 2.", "front": "<div class=\"lc lc-front lc-clz role-cloze\">\n  <div class=\"lc-tab is-asked\">asked 3×, multiple choice<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">08<\/span> <span class=\"lc-topic\">Shortest paths<\/span><\/header>\n    <div class=\"lc-text\">Dijkstra's algorithm fails with <span class=\"cloze\" data-cloze=\"negative&#x20;edge&#x20;weights\" data-ordinal=\"1\">[...]<\/span> because a settled node's distance <span class=\"cloze-inactive\" data-ordinal=\"2\">can still decrease<\/span>.<\/div>\n    <div class=\"lc-cue\"><\/div>\n    \n  <\/div>\n<\/div>", "back": "<div class=\"lc lc-back lc-clz role-cloze\">\n  <div class=\"lc-tab is-asked\">asked 3×, multiple choice<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">08<\/span> <span class=\"lc-topic\">Shortest paths<\/span><\/header>\n    <div class=\"lc-text\" id=\"answer\">Dijkstra's algorithm fails with <span class=\"cloze\" data-ordinal=\"1\">negative edge weights<\/span> because a settled node's distance <span class=\"cloze-inactive\" data-ordinal=\"2\">can still decrease<\/span>.<\/div>\n    <div class=\"lc-cue\"><\/div>\n    \n    \n    <div class=\"lc-extra\">Use Bellman-Ford when negative weights can occur.<\/div>\n    <details class=\"lc-plate\">\n      <summary><span class=\"lc-thumb\"><img src=\"media/l08-s15.svg\" alt=\"Lecture 8, slide 15\"><\/span><span class=\"lc-cite\"><span class=\"lc-src\">Lecture 8, slide 15<\/span><span class=\"lc-excerpt\">Dijkstra assumes w(e) ≥ 0: once a node is settled, its distance is final.<\/span><span class=\"lc-toggle\"><\/span><\/span><\/summary>\n      <div class=\"lc-slide\"><img src=\"media/l08-s15.svg\" alt=\"Lecture 8, slide 15\"><\/div>\n    <\/details>\n  <\/div>\n<\/div>"}, {"id": "10t", "ord": 1, "kind": "Computer science", "role": "cloze", "model": "Lectern Cloze", "weight": "asked 3×, multiple choice", "note": "Typed cloze, card 1 of 2. The student typed \"negative weights\".", "front": "<div class=\"lc lc-front lc-clz role-cloze is-typed\">\n  <div class=\"lc-tab is-asked\">asked 3×, multiple choice<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">08<\/span> <span class=\"lc-topic\">Shortest paths<\/span><\/header>\n    <div class=\"lc-text\">Dijkstra's algorithm fails with <span class=\"cloze\" data-cloze=\"negative&#x20;edge&#x20;weights\" data-ordinal=\"1\">[...]<\/span> because a settled node's distance <span class=\"cloze-inactive\" data-ordinal=\"2\">can still decrease<\/span>.<\/div>\n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-slot\"><div class=\"lc-type\">\n<center>\n<input type=text id=typeans onkeypress=\"_typeAnsPress();\"\n   style=\"font-family: 'Arial'; font-size: 20px;\">\n<\/center>\n<\/div><\/div>\n  <\/div>\n<\/div>", "back": "<div class=\"lc lc-back lc-clz role-cloze is-typed\">\n  <div class=\"lc-tab is-asked\">asked 3×, multiple choice<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">08<\/span> <span class=\"lc-topic\">Shortest paths<\/span><\/header>\n    <div class=\"lc-text\" id=\"answer\">Dijkstra's algorithm fails with <span class=\"cloze\" data-ordinal=\"1\">negative edge weights<\/span> because a settled node's distance <span class=\"cloze-inactive\" data-ordinal=\"2\">can still decrease<\/span>.<\/div>\n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-a\"><div class=\"lc-type\">\n<div style=\"font-family: 'Arial'; font-size: 20px\"><code id=typeans><span class=typeGood>negative <\/span><span class=typeMissed>-----<\/span><span class=typeGood>weights<\/span><br><span id=typearrow>&darr;<\/span><br><span class=typeGood>negative <\/span><span class=typeMissed>edge <\/span><span class=typeGood>weights<\/span><\/code><\/div><\/div><\/div>\n    \n    <div class=\"lc-extra\">Use Bellman-Ford when negative weights can occur.<\/div>\n    <details class=\"lc-plate\">\n      <summary><span class=\"lc-thumb\"><img src=\"media/l08-s15.svg\" alt=\"Lecture 8, slide 15\"><\/span><span class=\"lc-cite\"><span class=\"lc-src\">Lecture 8, slide 15<\/span><span class=\"lc-excerpt\">Dijkstra assumes w(e) ≥ 0: once a node is settled, its distance is final.<\/span><span class=\"lc-toggle\"><\/span><\/span><\/summary>\n      <div class=\"lc-slide\"><img src=\"media/l08-s15.svg\" alt=\"Lecture 8, slide 15\"><\/div>\n    <\/details>\n  <\/div>\n<\/div>"}, {"id": "11", "ord": 1, "kind": "Life science", "role": "name-two", "model": "Lectern Q&A", "weight": "asked 5×, short answer", "note": "", "front": "<div class=\"lc lc-front role-name-two\">\n  <div class=\"lc-tab is-asked\">asked 5×, short answer<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">04<\/span> <span class=\"lc-topic\">Cell division<\/span><\/header>\n    <div class=\"lc-q\">Name two differences between mitosis and meiosis.<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-slot\"><div class=\"lc-shape\" aria-hidden=\"true\"><span><\/span><span><\/span><\/div><\/div>\n  <\/div>\n<\/div>", "back": "<div class=\"lc lc-back role-name-two\">\n  <div class=\"lc-tab is-asked\">asked 5×, short answer<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">04<\/span> <span class=\"lc-topic\">Cell division<\/span><\/header>\n    <div class=\"lc-q\">Name two differences between mitosis and meiosis.<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-a\" id=\"answer\"><div class=\"lc-body\"><ul><li><mark>One division<\/mark> versus two.<\/li><li><mark>Identical<\/mark> versus recombined daughter cells.<\/li><\/ul><\/div><\/div>\n    \n    <details class=\"lc-plate\">\n      <summary><span class=\"lc-thumb\"><img src=\"media/l04-s30.svg\" alt=\"Lecture 4, slide 30\"><\/span><span class=\"lc-cite\"><span class=\"lc-src\">Lecture 4, slide 30<\/span><span class=\"lc-excerpt\">Mitosis: one division, two identical diploid cells. Meiosis: two divisions, four haploid cells.<\/span><span class=\"lc-toggle\"><\/span><\/span><\/summary>\n      <div class=\"lc-slide\"><img src=\"media/l04-s30.svg\" alt=\"Lecture 4, slide 30\"><\/div>\n    <\/details>\n  <\/div>\n<\/div>"}, {"id": "12", "ord": 1, "kind": "Life science", "role": "case", "model": "Lectern Q&A", "weight": "core", "note": "", "front": "<div class=\"lc lc-front role-case\">\n  <div class=\"lc-tab\">core<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">09<\/span> <span class=\"lc-topic\">Acid-base balance<\/span><\/header>\n    <div class=\"lc-q\">Arterial pH 7.30 with raised pCO<sub>2<\/sub>: which disorder?<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-slot\"><div class=\"lc-shape\" aria-hidden=\"true\"><span><\/span><span><\/span><\/div><\/div>\n  <\/div>\n<\/div>", "back": "<div class=\"lc lc-back role-case\">\n  <div class=\"lc-tab\">core<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">09<\/span> <span class=\"lc-topic\">Acid-base balance<\/span><\/header>\n    <div class=\"lc-q\">Arterial pH 7.30 with raised pCO<sub>2<\/sub>: which disorder?<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-a\" id=\"answer\"><div class=\"lc-body\"><mark>Respiratory acidosis<\/mark>.<\/div><\/div>\n    <div class=\"lc-extra\">Low pH means acidosis; raised pCO<sub>2<\/sub> points to the lungs. The kidneys compensate by raising HCO<sub>3<\/sub><sup>-<\/sup>.<\/div>\n    <details class=\"lc-plate\">\n      <summary><span class=\"lc-thumb\"><img src=\"media/l09-s11.svg\" alt=\"Lecture 9, slide 11\"><\/span><span class=\"lc-cite\"><span class=\"lc-src\">Lecture 9, slide 11<\/span><span class=\"lc-excerpt\">pH below 7.35 with pCO2 above 45 mmHg: respiratory acidosis.<\/span><span class=\"lc-toggle\"><\/span><\/span><\/summary>\n      <div class=\"lc-slide\"><img src=\"media/l09-s11.svg\" alt=\"Lecture 9, slide 11\"><\/div>\n    <\/details>\n  <\/div>\n<\/div>"}, {"id": "12t", "ord": 1, "kind": "Life science", "role": "case", "model": "Lectern Q&A", "weight": "core", "note": "Typed. The student typed the answer correctly.", "front": "<div class=\"lc lc-front role-case is-typed\">\n  <div class=\"lc-tab\">core<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">09<\/span> <span class=\"lc-topic\">Acid-base balance<\/span><\/header>\n    <div class=\"lc-q\">Arterial pH 7.30 with raised pCO<sub>2<\/sub>: which disorder?<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-slot\"><div class=\"lc-type\">\n<center>\n<input type=text id=typeans onkeypress=\"_typeAnsPress();\"\n   style=\"font-family: 'Arial'; font-size: 20px;\">\n<\/center>\n<\/div><\/div>\n  <\/div>\n<\/div>", "back": "<div class=\"lc lc-back role-case is-typed\">\n  <div class=\"lc-tab\">core<\/div>\n  <div class=\"lc-sheet\">\n    <header class=\"lc-head\"><span class=\"lc-lec\">09<\/span> <span class=\"lc-topic\">Acid-base balance<\/span><\/header>\n    <div class=\"lc-q\">Arterial pH 7.30 with raised pCO<sub>2<\/sub>: which disorder?<\/div>\n    \n    <div class=\"lc-cue\"><\/div>\n    <div class=\"lc-a\" id=\"answer\"><div class=\"lc-type\">\n<div style=\"font-family: 'Arial'; font-size: 20px\"><code id=typeans><span class=typeGood>respiratory acidosis<\/span><\/code><\/div><\/div><div class=\"lc-body\"><mark>Respiratory acidosis<\/mark>.<\/div><\/div>\n    <div class=\"lc-extra\">Low pH means acidosis; raised pCO<sub>2<\/sub> points to the lungs. The kidneys compensate by raising HCO<sub>3<\/sub><sup>-<\/sup>.<\/div>\n    <details class=\"lc-plate\">\n      <summary><span class=\"lc-thumb\"><img src=\"media/l09-s11.svg\" alt=\"Lecture 9, slide 11\"><\/span><span class=\"lc-cite\"><span class=\"lc-src\">Lecture 9, slide 11<\/span><span class=\"lc-excerpt\">pH below 7.35 with pCO2 above 45 mmHg: respiratory acidosis.<\/span><span class=\"lc-toggle\"><\/span><\/span><\/summary>\n      <div class=\"lc-slide\"><img src=\"media/l09-s11.svg\" alt=\"Lecture 9, slide 11\"><\/div>\n    <\/details>\n  <\/div>\n<\/div>"}];

// What Anki's desktop reviewer adds around every card (ts/reviewer/reviewer.scss),
// so that the skins are tested against the same defaults they meet in Anki.
const REVIEWER_CSS = `
hr { background-color: #c0c0c0; margin: 1em 0; border: none; height: 1px; }
body { margin: 20px; overflow-wrap: break-word; }
body.nightMode { background-color: var(--canvas); color: var(--fg); }
:root { --canvas: #2c2c2c; --fg: #fcfcfc; }
img { max-width: 100%; max-height: 95vh; }
li { text-align: start; }
pre { text-align: left; }
#typeans { width: 100%; box-sizing: border-box; line-height: 1.75; }
code#typeans { white-space: pre-wrap; font-variant-ligatures: none; }
.typeGood { background: #afa; color: black; }
.typeBad { color: black; background: #faa; }
.typeMissed { color: black; background: #ccc; }
`;
const MATHJAX = '<script>window.MathJax={tex:{inlineMath:[["\\\\(","\\\\)"]],displayMath:[["\\\\[","\\\\]"]]},chtml:{scale:1}};<\/script>' +
  '<script async src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"><\/script>';

const params = new URLSearchParams(location.search);
const state = {
  skin: 'object',
  mode: params.get('mode') || 'both',
  w: params.get('w') || '360',
  slide: params.get('slide') || 'closed',
};
const only = params.get('cards') ? params.get('cards').split(',') : null;

function doc(card, side, skin, width, night) {
  const html = side === 'front' ? card.front : card.back;
  const math = /\\[(\[]/.test(html) ? MATHJAX : '';
  return '<!doctype html><html' + (width === 360 ? ' class="mobile"' : '') + '><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width, initial-scale=1"><style>' + REVIEWER_CSS + '</style>' +
    '<link rel="stylesheet" href="../../anki/style-' + skin + '.css">' + math + '</head>' +
    '<body class="card card' + card.ord + (night ? ' nightMode night_mode' : '') + '"><div id="qa">' + html + '</div></body></html>';
}

function list(v, all) { return v === 'both' ? all : [v]; }

function render() {
  const out = document.getElementById('out');
  out.innerHTML = '';
  const skins = ['object'];
  const modes = list(state.mode, ['light', 'night']);
  const widths = list(state.w, ['360', '600']).map(Number);
  CARDS.forEach((c) => {
    if (only && !only.includes(c.id)) return;
    const sec = document.createElement('section');
    sec.id = 'c' + c.id;
    const role = c.role.replace('-', ' ');
    sec.innerHTML = '<h2><span class="n">' + c.id + '</span>' +
      role.charAt(0).toUpperCase() + role.slice(1) + '<span class="meta">' + c.kind + ' · ' + c.model +
      ' · Role "' + c.role + '" · ' + c.weight + (c.note ? ' · ' + c.note : '') + '</span></h2>';
    const row = document.createElement('div');
    row.className = 'row';
    skins.forEach((skin) => modes.forEach((mode) => widths.forEach((w) => {
      const g = document.createElement('div');
      g.className = 'group';
      ['front', 'back'].forEach((side) => {
        const fig = document.createElement('figure');
        fig.innerHTML = '<figcaption>' + skin + ' · ' + mode + ' · ' + w + ' · ' + side + '</figcaption>';
        const f = document.createElement('iframe');
        f.title = 'Card ' + c.id + ' ' + side + ', ' + skin + ', ' + mode + ', ' + w + ' pixels';
        f.style.width = w + 'px';
        f.addEventListener('load', () => {
          const d = f.contentDocument;
          const fit = () => { f.style.height = d.documentElement.offsetHeight + 'px'; };
          fit();
          new ResizeObserver(fit).observe(d.documentElement);
          if (state.slide === 'open') d.querySelectorAll('details.lc-plate').forEach((x) => (x.open = true));
        });
        f.srcdoc = doc(c, side, skin, w, mode === 'night');
        fig.appendChild(f);
        g.appendChild(fig);
      });
      row.appendChild(g);
    })));
    sec.appendChild(row);
    out.appendChild(sec);
  });
}

const nav = document.querySelector('.jump');
CARDS.forEach((c) => nav.insertAdjacentHTML('beforeend', '<a href="#c' + c.id + '">' + c.id + '</a>'));

function sync() {
  document.querySelectorAll('.seg').forEach((s) => s.querySelectorAll('button').forEach((b) =>
    b.setAttribute('aria-pressed', String(b.dataset.v === state[s.dataset.key]))));
}
document.querySelectorAll('.seg').forEach((s) => s.addEventListener('click', (e) => {
  const v = e.target.dataset.v;
  if (!v) return;
  state[s.dataset.key] = v;
  sync();
  if (s.dataset.key === 'slide') {
    document.querySelectorAll('iframe').forEach((f) => f.contentDocument &&
      f.contentDocument.querySelectorAll('details.lc-plate').forEach((d) => (d.open = v === 'open')));
  } else {
    render();
  }
}));
sync();
render();
</script>
</body>

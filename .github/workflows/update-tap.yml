name: Update Homebrew tap

# Rewrites Casks/lectern.rb in stegra05/homebrew-tap whenever a release is
# published (drafts don't count — publishing is the manual review step).
# Needs the TAP_GITHUB_TOKEN secret: a fine-grained PAT with contents:write
# on stegra05/homebrew-tap.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to bump the cask to (e.g. v2.13.0)"
        required: true

permissions: {}

jobs:
  bump-cask:
    runs-on: ubuntu-latest
    steps:
      - name: Download the dmg and compute its checksum
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          v="${TAG#v}"
          base="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          curl -fsSL -o lectern.dmg "${base}/Lectern-macOS.dmg"
          {
            echo "VERSION=${v}"
            echo "SHA=$(sha256sum lectern.dmg | cut -d' ' -f1)"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          repository: stegra05/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}

      - name: Bump cask and push
        run: |
          cask=Casks/lectern.rb
          sed -i "s/^  version \".*\"/  version \"${VERSION}\"/" "$cask"
          sed -i "s/^  sha256 \"[0-9a-f]*\"/  sha256 \"${SHA}\"/" "$cask"
          # A re-run for a tag the cask already holds has nothing to commit.
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "lectern ${VERSION}"
          git push

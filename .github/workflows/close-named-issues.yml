name: Close named issues

# GitHub closes the issues a PR names with "Closes #N" only when the PR merges
# into the default branch, which is main (v2). This does the same for PRs merged
# into v3, so the board's "Item closed" workflow moves them to Done.

on:
  pull_request:
    types: [closed]
    branches: [v3]

permissions:
  issues: write

jobs:
  close:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Close the issues the PR names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          numbers=$(grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #[0-9]+' <<< "$BODY" | grep -oE '[0-9]+' | sort -u || true)
          for n in $numbers; do
            gh issue close "$n" --reason completed --comment "Merged into v3 in #$PR."
          done

name: Release

# Builds and publishes desktop bundles when a version tag is pushed:
#   git tag v2.0.0 && git push origin v2.0.0
# Creates one draft GitHub Release up front, with the tag's CHANGELOG section
# as its notes, and every platform build uploads into it. (Letting each build
# find-or-create the draft itself races: two builds can each create one, and
# the tag ends up with two half-filled drafts.) Review the draft, then publish.
#
# A release holds two downloads, Lectern-macOS.dmg and
# Lectern-Windows-Setup.exe, plus what the updater reads (latest.json and
# Lectern-macOS.app.tar.gz). The names carry no version, so the website and
# README link straight to releases/latest/download/<name>.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's CHANGELOG section
        run: |
          v="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          # The two downloads lead the notes: someone new to GitHub should not
          # have to pick a file out of the asset list.
          {
            echo "**Download:** [Mac](${base}/Lectern-macOS.dmg) · [Windows](${base}/Lectern-Windows-Setup.exe)"
            echo
            echo "Already have Lectern? It updates itself."
          } > notes.md
          awk -v v="$v" '$0 ~ "^## " v " " {f=1; next} /^## /{f=0} f' CHANGELOG.md > changes.md
          [ -s changes.md ] || echo "See CHANGELOG.md for details." > changes.md
          cat changes.md >> notes.md
      - uses: actions/github-script@v7
        id: create
        with:
          script: |
            const fs = require('fs')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.GITHUB_REF_NAME,
              name: `Lectern ${process.env.GITHUB_REF_NAME}`,
              body: fs.readFileSync('notes.md', 'utf8'),
              draft: true,
            })
            return data.id

  build:
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # one build for Apple Silicon and Intel
            args: --target universal-apple-darwin
            asset: Lectern-macOS[ext]
          - platform: windows-latest
            args: ""
            asset: Lectern-Windows-Setup[ext]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      # Restores the release-profile cache primed on main (release-cache.yml).
      # Saving is skipped: caches created on a tag are unreachable from other
      # refs, so uploading the multi-GB target dir would only slow the release.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: release-${{ matrix.platform }}
          save-if: false

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signing (minisign). tauri-action also generates and
          # uploads latest.json to the release when these are set. latest.json
          # carries the signatures, so the .sig files stay out of the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS signing + notarization: once the Apple Developer secrets exist,
          # add these env entries back. Do NOT add them before the secrets exist:
          # a missing secret becomes an empty string, which the bundler treats as
          # "signing requested" and the build fails importing an empty certificate.
          #   APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          #   APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          #   APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          #   APPLE_ID: ${{ secrets.APPLE_ID }}
          #   APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          #   APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: ${{ matrix.args }}
          releaseAssetNamePattern: ${{ matrix.asset }}
          uploadUpdaterSignatures: false

  # tauri-action writes api.github.com asset URLs into latest.json. Anonymous
  # API calls are limited to 60 an hour per IP address, which a campus network
  # shares, so updates there would fail at random. The plain download URLs
  # have no such limit.
  updater-urls:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Point latest.json at the download URLs
        run: |
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          gh release download "$GITHUB_REF_NAME" --pattern latest.json
          gh release view "$GITHUB_REF_NAME" --json assets \
            --jq '.assets | map({key: .apiUrl, value: .name}) | from_entries' > names.json
          jq --slurpfile names names.json --arg base "$base" '
            .platforms |= map_values(
              .url = "\($base)/\($names[0][.url] // error("no asset for \(.url)"))"
            )' latest.json > rewritten.json
          mv rewritten.json latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --clobber

name: CI

on:
  push:
    branches: [v3]
  pull_request:

# A new push to the same branch or PR supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v3' }}

jobs:
  check:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    name: App end to end (${{ matrix.window }} window)
    runs-on: ubuntu-latest
    # Experiment: does a shown window remove the 2 s per action? Removed after.
    strategy:
      fail-fast: false
      matrix:
        window: [hidden, shown]
    env:
      E2E_SHOW: ${{ matrix.window == 'shown' && '1' || '0' }}
      DEBUG: pw:api
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Electron's binary is fetched on install: keep it between runs.
      - uses: actions/cache@v5
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      # Unpacks the cached binary in a step of its own, so its time is not the test's.
      - run: node packages/app/node_modules/electron/install.js
      # Ubuntu 24 blocks the user namespaces Chromium's sandbox needs.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Electron needs a display; xvfb-run gives it a virtual one.
      - run: xvfb-run --auto-servernum pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: packages/app/test-results
          retention-days: 7
